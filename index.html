<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OSINT Panel</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body { background: #0a0a0a; color: white; font-family: monospace; text-align: center; padding: 20px; }
        h1 { color: #b300ff; text-shadow: 0 0 10px #b300ff; }
        button { background: transparent; border: 2px solid #b300ff; color: white; padding: 15px; margin: 10px 0; border-radius: 10px; width: 100%; font-size: 16px; font-weight: bold; }
        button:active { background: #b300ff; color: black; }
    </style>
</head>
<body>
    <h1>OSINT PRO</h1>
    
    <button onclick="send('ip')">Проверить IP</button>
    <button onclick="send('username')">Поиск по Нику</button>
    <button onclick="send('tg')">Telegram Инфо</button>
    <button onclick="send('tempmail')">Временная Почта</button>

    <script>
        let tg = window.Telegram.WebApp;
        tg.expand();

        function send(cmd) {
            // Отправляем короткую команду боту
            tg.sendData(cmd);
            tg.close();
        }
    </script>
</body>
</html>
